name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 grafana_loki_provider tests

  unit:
    name: unit (airflow ${{ matrix.airflow-version }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow-version: ["2.11.2", "3.4.0"]
        python-version: ["3.11", "3.12"]
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: >
          pip install -e ".[test]" "apache-airflow==${{ matrix.airflow-version }}" apache-airflow-providers-http
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow-version }}/constraints-${{ matrix.python-version }}.txt"
      - run: airflow db migrate
      - run: pytest -v --ignore=tests/integration

  integration:
    name: integration (airflow ${{ matrix.airflow-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow-version: ["2.11.2", "3.4.0"]
    services:
      loki:
        image: grafana/loki:3.4.2
        ports:
          - 3100:3100
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
      LOKI_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: >
          pip install -e ".[test]" "apache-airflow==${{ matrix.airflow-version }}" apache-airflow-providers-http
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow-version }}/constraints-3.12.txt"
      - run: airflow db migrate
      - name: Wait for Loki
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$LOKI_URL/ready"; then exit 0; fi
            sleep 2
          done
          echo "Loki did not become ready"; exit 1
      - run: pytest -v tests/integration
