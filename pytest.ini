[pytest]
markers = 
    current: current tests
    hool: hook related
    integration: requires a running Loki (set LOKI_URL)
filterwarnings =
    # Emitted by Airflow 2.11 itself at import time; not actionable here. Matched on the
    # DeprecationWarning base class because RemovedInAirflow3Warning doesn't exist in Airflow 3.
    ignore:Timer and timing metrics publish in seconds were deprecated:DeprecationWarning
